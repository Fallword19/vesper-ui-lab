<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>底栏图标</title>
<style>
  :root {
    --bg: #F7F7F8; --surface: #FFFFFF; --pill: #F2F2F4;
    --ink: #1C1C1E; --idle: #9C9CA1; --accent: #E07A5F; --note: #8A8A8F;
  }
  .dark {
    --bg: #111113; --surface: #1C1C1E; --pill: #2C2C2E;
    --ink: #F2F2F4; --idle: #7C7C82; --accent: #E8876D; --note: #7C7C82;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #EDEDEF; font-family: -apple-system, "PingFang SC", system-ui, sans-serif; color: #1C1C1E; padding: 24px 16px 48px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  p.lead { color: #8A8A8F; font-size: 13px; margin-bottom: 24px; line-height: 1.6; }
  h2 { font-size: 13px; font-weight: 600; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 3px; height: 14px; background: #1C1C1E; border-radius: 2px; }
  .stage { background: var(--bg); border-radius: 28px; padding: 18px 0; max-width: 430px; }
  .stage + .stage { margin-top: 10px; }
  .bar { display: flex; gap: 4px; padding: 6px; margin: 0 20px; background: var(--surface); border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.06); }
  .item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-radius: 999px; font-size: 11px; color: var(--idle); cursor: pointer; transition: background .25s; }
  .item.on { background: var(--pill); color: var(--ink); font-weight: 600; }
  .item svg { width: 26px; height: 26px; fill: none; stroke: var(--idle); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .item.on svg { stroke: var(--ink); }
  .item.on svg .a { fill: var(--accent); stroke: none; }
  .old .item svg { stroke: none; fill: var(--ink); }
  .old .item.on { color: var(--accent); }
  .old .item.on svg { fill: var(--accent); }
  .big { display: flex; gap: 28px; padding: 24px; background: #fff; border-radius: 24px; max-width: 430px; justify-content: center; }
  .big svg { width: 64px; height: 64px; fill: none; stroke: #1C1C1E; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .big svg .a { fill: #E07A5F; stroke: none; }
  ul { font-size: 13px; line-height: 1.8; color: #3A3A3C; padding-left: 18px; max-width: 430px; }
</style>
</head>
<body>
<h1>首页底栏 · 新图标</h1>
<p class="lead">细线 1.6pt、圆角端点，和卡片上的细字、条纹进度条一个重量。<br>选中时：浅灰胶囊托起 + 图标变黑 + 一个小部件变成「• Claude」那颗橙色。点一下可以切换。</p>

<h2>放大看</h2>
<div class="big" id="big"></div>

<h2>新 · 浅色</h2>
<div class="stage"><div class="bar" data-sel="0"></div></div>

<h2>新 · 深色</h2>
<div class="stage dark"><div class="bar" data-sel="0"></div></div>

<h2>旧 · 对比</h2>
<div class="stage old"><div class="bar" data-sel="0" data-old></div></div>

<h2>改了什么</h2>
<ul>
  <li><b>首页</b>：屋顶 + 方体，门是橙色。</li>
  <li><b>日历</b>：去掉满屏小点，只留一条横线，今天是一颗橙点。</li>
  <li><b>娱乐</b>：三个方格 + 一个圆，圆是橙色。比四个实心方块轻。</li>
  <li><b>设置</b>：齿轮换成两根滑杆，像仪器上的旋钮；下面那颗是橙色。</li>
  <li>选中不再整只染橙，橙色只占一小块，和页面里的用法一致。</li>
</ul>

<script>
  const icons = [
    ['首页', `<path d="M4.5 10.4 12 4.3l7.5 6.1V18q0 2-2 2h-11q-2 0-2-2z"/><rect class="a" x="10" y="13.5" width="4" height="6.5" rx="1.4"/>`],
    ['日历', `<rect x="4" y="5.5" width="16" height="14.5" rx="3.5"/><path d="M8.5 3.5v3.7M15.5 3.5v3.7M4 10.2h16"/><circle class="a" cx="15.5" cy="15" r="1.6"/>`],
    ['娱乐', `<rect x="4" y="4" width="7" height="7" rx="2.2"/><rect x="13" y="4" width="7" height="7" rx="2.2"/><rect x="4" y="13" width="7" height="7" rx="2.2"/><circle class="a" cx="16.5" cy="16.5" r="3.5"/>`],
    ['设置', `<path d="M4 8h2.4M11.6 8H20M4 16h8.4M17.6 16H20"/><circle cx="9" cy="8" r="2.4"/><circle class="a" cx="15" cy="16" r="2.4"/>`],
  ];
  // 旧版：近似 SF Symbols 的实心图标
  const oldIcons = [
    `<path d="M12 3 2.5 11h2.8v9.5h5v-6h3.4v6h5V11h2.8z"/>`,
    `<path d="M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm0 5v9h14v-9z"/>`,
    `<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>`,
    `<path d="M10.3 2h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9L2 13.7v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/>`,
  ];
  const svg = body => `<svg viewBox="0 0 24 24">${body}</svg>`;

  document.getElementById('big').innerHTML = icons.map(([, b]) => svg(b)).join('');

  document.querySelectorAll('.bar').forEach(bar => {
    const old = bar.hasAttribute('data-old');
    const render = () => {
      const sel = +bar.dataset.sel;
      bar.innerHTML = icons.map(([t, b], i) =>
        `<div class="item${i === sel ? ' on' : ''}" data-i="${i}">${svg(old ? oldIcons[i] : b)}<span>${t}</span></div>`
      ).join('');
    };
    bar.addEventListener('click', e => {
      const it = e.target.closest('.item');
      if (it) { bar.dataset.sel = it.dataset.i; render(); }
    });
    render();
  });
</script>
</body>
</html>
