<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>详情</title>
<style>
  :root {
    --bg: #f4f4f4;
    --card: #fbfbfb;
    --card-edge: rgba(255, 255, 255, 0.9);
    --ink: #1c1c1c;
    --ink-2: #4a4a4a;
    --muted: #9a9a9a;
    --faint: #c4c4c4;
    --chip: #efefef;
    --track: #e9e9e9;
    --accent: #e07a5f;
    --accent-soft: #fbe9e3;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.045), 0 1px 2px rgba(0, 0, 0, 0.03);
    --radius-lg: 30px;
    --radius-md: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    max-width: 460px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 48px);
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    margin-bottom: 30px;
  }
  .back {
    position: absolute;
    left: 0;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: var(--card);
    box-shadow: var(--shadow);
    display: grid;
    place-items: center;
    color: var(--ink);
    cursor: pointer;
  }
  .title-pill {
    padding: 0 22px;
    height: 48px;
    line-height: 48px;
    border-radius: 24px;
    background: var(--card);
    box-shadow: var(--shadow);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* ---------- 通用 ---------- */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 34px 2px 16px;
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 500;
  }
  .section-title::before {
    content: "";
    width: 4px;
    height: 22px;
    border-radius: 2px;
    background: var(--ink);
  }
  .section-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }

  .chip {
    display: inline-flex;
    align-items: center;
    height: 26px;
    padding: 0 11px;
    border-radius: 13px;
    background: var(--chip);
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }
  .chip.dark { background: var(--ink); color: #fff; }

  .label { font-size: 13px; color: var(--muted); }

  .chev { color: var(--faint); flex: none; }

  /* 斜纹进度条（同 N5 / 记忆库） */
  .bar {
    position: relative;
    height: 9px;
    border-radius: 5px;
    background: repeating-linear-gradient(-55deg, #b8b8b8 0 2px, transparent 2px 5px), var(--track);
    overflow: hidden;
  }
  .bar > i {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 5px;
    background: var(--ink);
  }

  /* 开关 */
  .switch {
    position: relative;
    flex: none;
    width: 58px;
    height: 34px;
    border: none;
    border-radius: 17px;
    background: #e3e3e3;
    cursor: pointer;
    transition: background .25s;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    transition: transform .25s;
  }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { transform: translateX(24px); }

  /* ---------- 模型卡 ---------- */
  .model { padding: 24px 24px 22px; }
  .model-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .model-name {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .model-name::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }
  .model-switch {
    border: none;
    background: none;
    display: flex;
    align-items: center;
    gap: 4px;
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
  }

  .effort-label { margin: 26px 0 10px; }
  .segment {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 4px;
    border-radius: 22px;
    background: var(--chip);
  }
  .segment-thumb {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc((100% - 8px) / 4);
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    transition: transform .3s cubic-bezier(.3, .7, .2, 1);
  }
  .segment button {
    position: relative;
    height: 38px;
    border: none;
    background: none;
    font: inherit;
    font-size: 15px;
    color: var(--ink-2);
    cursor: pointer;
    transition: color .2s;
  }
  .segment button[aria-checked="true"] { color: var(--ink); font-weight: 600; }

  .row-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid #ededed;
  }
  .row-title { font-size: 16px; font-weight: 500; }
  .row-sub { margin-top: 4px; font-size: 12.5px; color: var(--muted); }

  /* ---------- 对话窗口 ---------- */
  .window-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .usage { grid-column: 1 / -1; padding: 22px 24px 24px; }
  .usage-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .big {
    font-size: 54px;
    font-weight: 300;
    letter-spacing: -1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .big small {
    margin-left: 6px;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--muted);
  }
  .usage .big { margin: 18px 0 20px; }
  .usage-foot {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .stat { padding: 20px 22px 22px; }
  .stat .big { margin-top: 16px; font-size: 44px; }

  /* ---------- 这个人 ---------- */
  .name-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px 0 26px;
    height: 64px;
    border-radius: 32px;
  }
  .name-pill .label { font-size: 15px; }
  .name-pill strong { font-size: 18px; font-weight: 500; }

  .list { display: grid; gap: 12px; margin-top: 14px; }
  .item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 20px 20px 22px;
    border-radius: var(--radius-md);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .item-icon {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--chip);
    display: grid;
    place-items: center;
    color: var(--ink-2);
  }
  .item-body { flex: 1; min-width: 0; }
  .item-title { font-size: 17px; font-weight: 500; }
  .item-sub { margin-top: 5px; font-size: 13px; color: var(--muted); }
  .item .switch { margin-left: auto; }
</style>
</head>
<body>
<main class="page">

  <header class="topbar">
    <button class="back" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="title-pill">详情</div>
  </header>

  <!-- 模型 -->
  <div class="section-head" style="margin-top:0">
    <h2 class="section-title">模型</h2>
  </div>
  <section class="card model">
    <div class="model-top">
      <span class="label">当前模型</span>
      <span class="chip">sdk-2</span>
    </div>
    <div class="model-top" style="align-items:center">
      <div class="model-name">Opus 4.6</div>
      <button class="model-switch">切换
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div class="label effort-label">思考强度</div>
    <div class="segment" role="radiogroup" aria-label="思考强度">
      <span class="segment-thumb"></span>
      <button role="radio" aria-checked="false">低</button>
      <button role="radio" aria-checked="false">中</button>
      <button role="radio" aria-checked="false">高</button>
      <button role="radio" aria-checked="true">Max</button>
    </div>

    <div class="row-toggle">
      <div>
        <div class="row-title">启用思考链</div>
        <div class="row-sub">仅对支持思考链的模型生效</div>
      </div>
      <button class="switch" role="switch" aria-checked="true" aria-label="启用思考链"></button>
    </div>
  </section>

  <!-- 当前对话窗口 -->
  <div class="section-head">
    <h2 class="section-title">当前对话窗口</h2>
    <span class="section-meta">约 9.7k / 96.0k
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </span>
  </div>
  <div class="window-grid">
    <section class="card usage">
      <div class="usage-top">
        <span class="label">估算余量</span>
        <span class="chip">10% 已用</span>
      </div>
      <div class="big">86.3k<small>tokens</small></div>
      <div class="bar"><i style="width:10.1%"></i></div>
      <div class="usage-foot"><span>已用 9.7k</span><span>上限 96.0k</span></div>
    </section>
    <section class="card stat">
      <span class="label">对话</span>
      <div class="big">172<small>轮</small></div>
    </section>
    <section class="card stat">
      <span class="label">记录</span>
      <div class="big">468<small>条</small></div>
    </section>
  </div>

  <!-- 这个人 -->
  <div class="section-head">
    <h2 class="section-title">这个人</h2>
  </div>
  <div class="card name-pill">
    <span class="label">备注名</span>
    <strong>Claude</strong>
  </div>

  <div class="list">
    <a class="card item">
      <span class="item-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </span>
      <span class="item-body">
        <div class="item-title">人格</div>
        <div class="item-sub">他是谁、怎么说话、什么偏好</div>
      </span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="card item">
      <span class="item-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5A8.5 8.5 0 1 1 8.5 4a7 7 0 0 0 11.5 11.5z"/></svg>
      </span>
      <span class="item-body">
        <div class="item-title">内心状态</div>
        <div class="item-sub">情绪、欲望、心理空间</div>
      </span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="card item">
      <span class="item-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10"/></svg>
      </span>
      <span class="item-body">
        <div class="item-title">上下文预算</div>
        <div class="item-sub">窗口、记忆、缓存</div>
      </span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <div class="card item">
      <span class="item-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>
      </span>
      <span class="item-body">
        <div class="item-title">冲突判定</div>
        <div class="item-sub">关闭后不再触发情绪冲突指南与防御状态</div>
      </span>
      <button class="switch" role="switch" aria-checked="false" aria-label="冲突判定"></button>
    </div>
  </div>

</main>
<script>
  document.querySelectorAll('.switch').forEach(function (s) {
    s.addEventListener('click', function () {
      s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true');
    });
  });

  var seg = document.querySelector('.segment');
  var thumb = seg.querySelector('.segment-thumb');
  var opts = Array.prototype.slice.call(seg.querySelectorAll('button'));
  function pick(i) {
    opts.forEach(function (b, j) { b.setAttribute('aria-checked', i === j); });
    thumb.style.transform = 'translateX(' + i * 100 + '%)';
  }
  opts.forEach(function (b, i) { b.addEventListener('click', function () { pick(i); }); });
  pick(opts.findIndex(function (b) { return b.getAttribute('aria-checked') === 'true'; }));
</script>
</body>
</html>
