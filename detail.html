<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>详情</title>
<style>
  :root {
    --bg: #f3f3f3;
    --ink: #1a1a1a;
    --ink-2: #3c3c3c;
    --muted: #9b9b9b;
    --faint: #c9c9c9;
    --chip: #ededed;
    --tick: #e2e2e2;
    --accent: #e07a5f;
    --accent-soft: #fbeae4;
    --card-bg: linear-gradient(180deg, #fdfdfd 0%, #f8f8f8 100%);
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.045), 0 2px 6px rgba(0, 0, 0, 0.025);
    --hatch: repeating-linear-gradient(-55deg, #b5b5b5 0 2px, #e6e6e6 2px 5px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(120% 50% at 50% 0%, #fafafa 0%, var(--bg) 60%) var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .page {
    max-width: 440px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 56px);
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: relative;
    display: flex;
    justify-content: center;
    height: 48px;
  }
  .round, .pill {
    background: #fbfbfb;
    box-shadow: var(--shadow);
  }
  .round {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  .topbar .round { position: absolute; left: 0; }
  .pill {
    height: 48px;
    padding: 0 24px;
    border-radius: 24px;
    line-height: 48px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* ---------- Hero：同首页日期行 ---------- */
  .hero {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 34px 4px 4px;
  }
  .hero h1 {
    font-size: 50px;
    font-weight: 300;
    letter-spacing: -1px;
  }
  .hero h1 small {
    margin-left: 4px;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--muted);
  }
  .hero span { font-size: 15px; color: var(--muted); }

  /* ---------- 分区标题 ---------- */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 30px 0 14px;
    min-height: 44px;
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 23px;
    font-weight: 500;
  }
  .section-title::before {
    content: "";
    width: 4px;
    height: 24px;
    border-radius: 2px;
    background: var(--ink);
  }
  .section-head .round { width: 44px; height: 44px; }
  .link-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px 0 16px;
    border-radius: 20px;
    background: var(--chip);
    font-size: 13px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid #fff;
    border-radius: 30px;
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .label { font-size: 13px; color: var(--muted); letter-spacing: .5px; }
  .head-row { display: flex; align-items: center; justify-content: space-between; }

  .chip {
    display: inline-flex;
    align-items: center;
    height: 26px;
    padding: 0 11px;
    border-radius: 13px;
    background: var(--chip);
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.dark { background: var(--ink); color: #fff; }

  .num {
    font-weight: 300;
    letter-spacing: -1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .num small {
    margin-left: 4px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--muted);
  }

  /* ---------- 模型 bento ---------- */
  .bento {
    display: grid;
    grid-template-columns: 1.08fr 1fr;
    gap: 14px;
  }
  .effort { grid-row: span 2; display: flex; flex-direction: column; }
  .effort-word { margin-top: 14px; font-size: 40px; font-weight: 600; letter-spacing: -.5px; }
  .effort-desc { margin-top: 6px; font-size: 12.5px; color: var(--muted); }

  .meter {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: end;
    gap: 9px;
    margin-top: 22px;
    min-height: 120px;
  }
  .meter button {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-end;
    gap: 9px;
    height: 100%;
  }
  .meter i {
    display: block;
    border-radius: 9px;
    background: var(--hatch);
    transition: background .25s, height .25s;
  }
  .meter button:nth-child(1) i { height: 24%; }
  .meter button:nth-child(2) i { height: 46%; }
  .meter button:nth-child(3) i { height: 70%; }
  .meter button:nth-child(4) i { height: 96%; }
  .meter button.on i { background: var(--ink); }
  .meter button.cur i { background: var(--ink); box-shadow: inset 0 0 0 0 #fff; }
  .meter span {
    font-size: 12px;
    text-align: center;
    color: var(--muted);
  }
  .meter button.cur span { color: var(--ink); font-weight: 600; }

  .mini { display: flex; flex-direction: column; justify-content: space-between; min-height: 148px; }
  .mini .num { font-size: 38px; }
  .mini-foot { display: flex; align-items: flex-end; justify-content: space-between; }

  .switch {
    position: relative;
    flex: none;
    width: 54px;
    height: 32px;
    border-radius: 16px;
    background: #e1e1e1;
    transition: background .25s;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .16);
    transition: transform .25s;
  }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); }

  .term {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 12px;
    border-radius: 12px;
    background: #f0f0f0;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .05);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 13px;
    color: var(--ink-2);
  }
  .term b { color: var(--muted); font-weight: 400; }
  .caret { width: 2px; height: 15px; border-radius: 1px; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- 对话窗口 ---------- */
  .window .usage {
    display: flex;
    align-items: baseline;
    gap: 2px;
    margin-top: 18px;
  }
  .window .usage .num { font-size: 56px; }
  .window .usage em { font-style: normal; font-size: 17px; color: var(--muted); }

  .ruler {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 46px;
    margin: 22px 0 6px;
  }
  .ruler i {
    width: 3px;
    height: 28px;
    border-radius: 2px;
    background: var(--tick);
  }
  .ruler i.major { height: 40px; background: #d2d2d2; }
  .ruler i.used { background: var(--ink); }
  .ruler i.edge { height: 46px; background: var(--accent); }
  .ruler-scale {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #ececec;
  }
  .stats div + div { padding-left: 16px; border-left: 1px solid #ececec; }
  .stats .num { font-size: 30px; }
  .stats p { margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* ---------- 这个人 ---------- */
  .who { padding: 22px 24px 24px; }
  .who-name {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -.5px;
  }
  .who-name::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }
  .wave { display: flex; align-items: flex-end; gap: 7px; height: 34px; margin-top: 22px; }
  .wave i { width: 5px; border-radius: 3px; background: var(--ink-2); }
  .wave i:nth-child(odd) { background: #a8a8a8; }
  .who-foot { display: flex; align-items: flex-end; justify-content: space-between; }
  .who-foot a { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); }

  .timeline { position: relative; margin-top: 18px; padding-left: 34px; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 9px;
    top: 30px;
    bottom: 30px;
    border-left: 1.5px dashed #cfcfcf;
  }
  .node { position: relative; margin-bottom: 14px; }
  .node::before {
    content: "";
    position: absolute;
    left: -34px;
    top: 50%;
    width: 16px;
    height: 16px;
    margin-top: -10px;
    border-radius: 50%;
    border: 2px solid #c4c4c4;
    background: var(--bg);
  }
  .node.lead::before { border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 8px var(--ink); }
  .node .card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 20px 18px 22px;
    border-radius: 26px;
  }
  .node-body { flex: 1; min-width: 0; }
  .node-title { font-size: 17px; font-weight: 500; }
  .node-sub { margin-top: 5px; font-size: 13px; color: var(--muted); }
  .chev { flex: none; color: var(--faint); }

  .conflict.off .node-title { color: var(--ink-2); }
</style>
</head>
<body>
<main class="page">

  <header class="topbar">
    <button class="round" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="pill">详情</div>
  </header>

  <div class="hero">
    <h1>Opus 4.6<small>/sdk-2</small></h1>
    <span>Claude</span>
  </div>

  <!-- 模型 -->
  <div class="section-head">
    <h2 class="section-title">模型</h2>
    <button class="round" aria-label="切换模型">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
    </button>
  </div>

  <div class="bento">
    <section class="card effort">
      <div class="head-row">
        <span class="label">思考强度</span>
        <span class="chip accent" id="effortTag">最深</span>
      </div>
      <div class="effort-word" id="effortWord">Max</div>
      <div class="effort-desc" id="effortDesc">更慢，但想得最透</div>
      <div class="meter" role="radiogroup" aria-label="思考强度">
        <button role="radio"><i></i><span>低</span></button>
        <button role="radio"><i></i><span>中</span></button>
        <button role="radio"><i></i><span>高</span></button>
        <button role="radio"><i></i><span>Max</span></button>
      </div>
    </section>

    <section class="card mini">
      <div class="head-row">
        <span class="label">思考链</span>
        <span class="chip dark" id="chainTag">开启</span>
      </div>
      <div class="mini-foot">
        <span class="label" style="font-size:12px;line-height:1.5">仅支持的<br>模型生效</span>
        <button class="switch" role="switch" aria-checked="true" aria-label="启用思考链" data-tag="chainTag"></button>
      </div>
    </section>

    <section class="card mini">
      <span class="label">通道</span>
      <div class="term"><b>&gt;_</b> sdk-2 <span class="caret"></span></div>
    </section>
  </div>

  <!-- 当前对话窗口 -->
  <div class="section-head">
    <h2 class="section-title">当前对话窗口</h2>
    <a class="link-pill">约 9.7k / 96.0k
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <section class="card window">
    <div class="head-row">
      <span class="label">估算余量</span>
      <span class="chip accent">已用 10%</span>
    </div>
    <div class="usage">
      <span class="num">86.3k</span><em>/96.0k</em>
    </div>
    <div class="ruler" id="ruler"></div>
    <div class="ruler-scale"><span>0</span><span>24k</span><span>48k</span><span>72k</span><span>96k</span></div>
    <div class="stats">
      <div><div class="num">172</div><p>轮</p></div>
      <div><div class="num">468</div><p>条记录</p></div>
      <div><div class="num">9.7k</div><p>已用</p></div>
    </div>
  </section>

  <!-- 这个人 -->
  <div class="section-head">
    <h2 class="section-title">这个人</h2>
  </div>

  <section class="card who">
    <div class="head-row">
      <span class="label">备注名</span>
      <span class="chip">编辑</span>
    </div>
    <div class="who-name">Claude</div>
    <div class="who-foot">
      <div class="wave">
        <i style="height:30%"></i><i style="height:55%"></i><i style="height:40%"></i><i style="height:100%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:62%"></i>
      </div>
    </div>
  </section>

  <div class="timeline">
    <div class="node lead">
      <a class="card">
        <span class="node-body">
          <div class="node-title">人格</div>
          <div class="node-sub">他是谁、怎么说话、什么偏好</div>
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>
    <div class="node">
      <a class="card">
        <span class="node-body">
          <div class="node-title">内心状态</div>
          <div class="node-sub">情绪、欲望、心理空间</div>
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>
    <div class="node">
      <a class="card">
        <span class="node-body">
          <div class="node-title">上下文预算</div>
          <div class="node-sub">窗口、记忆、缓存</div>
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>
    <div class="node conflict" style="margin-bottom:0">
      <div class="card">
        <span class="node-body">
          <div class="node-title">冲突判定</div>
          <div class="node-sub">关闭后不再触发情绪冲突指南与防御状态</div>
        </span>
        <button class="switch" role="switch" aria-checked="false" aria-label="冲突判定"></button>
      </div>
    </div>
  </div>

</main>
<script>
  // 开关
  document.querySelectorAll('.switch').forEach(function (s) {
    s.addEventListener('click', function () {
      var on = s.getAttribute('aria-checked') !== 'true';
      s.setAttribute('aria-checked', on);
      var tag = s.dataset.tag && document.getElementById(s.dataset.tag);
      if (tag) { tag.textContent = on ? '开启' : '关闭'; tag.className = 'chip' + (on ? ' dark' : ''); }
    });
  });

  // 思考强度
  var levels = [
    { word: '低', tag: '最快', desc: '几乎不停顿，直接回答' },
    { word: '中', tag: '均衡', desc: '想一想，再开口' },
    { word: '高', tag: '深入', desc: '多绕几步，更稳' },
    { word: 'Max', tag: '最深', desc: '更慢，但想得最透' }
  ];
  var bars = Array.prototype.slice.call(document.querySelectorAll('.meter button'));
  function pick(i) {
    bars.forEach(function (b, j) {
      b.classList.toggle('on', j <= i);
      b.classList.toggle('cur', j === i);
      b.setAttribute('aria-checked', j === i);
    });
    document.getElementById('effortWord').textContent = levels[i].word;
    document.getElementById('effortTag').textContent = levels[i].tag;
    document.getElementById('effortDesc').textContent = levels[i].desc;
  }
  bars.forEach(function (b, i) { b.addEventListener('click', function () { pick(i); }); });
  pick(3);

  // 容量刻度：48 根，每根 2k
  var ruler = document.getElementById('ruler');
  var used = 9.7 / 96 * 48;
  for (var k = 0; k < 48; k++) {
    var t = document.createElement('i');
    if (k < Math.floor(used)) t.className = 'used';
    else if (k === Math.floor(used)) t.className = 'edge';
    else if (k % 12 === 0) t.className = 'major';
    ruler.appendChild(t);
  }
</script>
</body>
</html>
