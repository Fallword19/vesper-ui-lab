<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>详情</title>
<style>
  :root {
    --bg: #f4f4f4;
    --ink: #1b1b1b;
    --ink-2: #555;
    --muted: #a3a3a3;
    --faint: #cdcdcd;
    --line: #ececec;
    --chip: #efefef;
    --accent: #e07a5f;
    --card-bg: linear-gradient(180deg, #fdfdfd 0%, #f9f9f9 100%);
    --shadow: 0 14px 34px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.025);
    --hatch: repeating-linear-gradient(-55deg, #bdbdbd 0 1.6px, #ebebeb 1.6px 5px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .page {
    max-width: 440px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 64px);
  }

  /* 顶栏 */
  .topbar { position: relative; display: flex; justify-content: center; height: 48px; margin-bottom: 8px; }
  .round, .pill { background: #fbfbfb; box-shadow: var(--shadow); }
  .round { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
  .topbar .round { position: absolute; left: 0; }
  .pill { height: 48px; padding: 0 24px; border-radius: 24px; line-height: 48px; font-size: 17px; font-weight: 600; letter-spacing: 1px; }

  /* 分区标题 */
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 34px 0 16px; height: 40px; }
  .section-title { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 500; }
  .section-title::before { content: ""; width: 4px; height: 22px; border-radius: 2px; background: var(--ink); }
  .section-head .round { width: 40px; height: 40px; color: var(--ink-2); }

  /* 卡片 */
  .card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.95);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 22px 24px;
  }
  .label { font-size: 13px; color: var(--muted); letter-spacing: .5px; }
  .head-row { display: flex; align-items: center; justify-content: space-between; }
  .chip { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 13px; background: var(--chip); color: var(--muted); font-size: 12px; }
  .num { font-weight: 200; letter-spacing: -1.5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .unit { margin-left: 6px; font-size: 13px; color: var(--muted); letter-spacing: 0; font-weight: 400; }
  .chev { flex: none; color: var(--faint); }

  /* 开关 */
  .switch { position: relative; flex: none; width: 52px; height: 31px; border-radius: 16px; background: #e4e4e4; transition: background .25s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .14); transition: transform .25s; }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { transform: translateX(21px); }

  /* ---------- 模型 ---------- */
  .model-name { display: flex; align-items: baseline; gap: 10px; margin-top: 18px; }
  .model-name .num { font-size: 46px; }
  .model-name button { display: flex; align-items: center; color: var(--faint); transform: translateY(-4px); }

  .effort { margin-top: 30px; }
  .slider { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; }
  .slider .track, .slider .fill { position: absolute; top: 10px; height: 2px; border-radius: 1px; }
  .slider .track { left: 12.5%; right: 12.5%; background: var(--line); }
  .slider .fill { left: 12.5%; background: var(--ink); transition: width .35s cubic-bezier(.3, .7, .2, 1); }
  .slider button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .slider .dot { width: 22px; height: 22px; display: grid; place-items: center; }
  .slider .dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: all .25s; }
  .slider button.on .dot::before { background: var(--ink); }
  .slider button.cur .dot::before { width: 12px; height: 12px; background: var(--ink); box-shadow: 0 0 0 5px #e9e9e9; }
  .slider span { font-size: 13px; color: var(--muted); transition: color .2s; }
  .slider button.cur span { color: var(--ink); font-weight: 500; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .divider { height: 1px; background: var(--line); margin: 24px 0 20px; }
  .row-title { font-size: 16px; }
  .row-sub { margin-top: 4px; font-size: 12.5px; color: var(--muted); }

  /* ---------- 对话窗口 ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .remain { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 20px; }
  .remain-main { display: flex; flex-direction: column; }
  .remain .num { margin-top: 22px; font-size: 60px; }
  .remain-foot { margin-top: auto; padding-top: 22px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .remain-foot b { font-weight: 500; color: var(--ink-2); }

  .tank { position: relative; flex: none; width: 40px; height: 140px; border-radius: 14px; background: var(--hatch); overflow: hidden; }
  .tank i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--ink); }
  .tank::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .03); }

  .stat { display: flex; flex-direction: column; justify-content: space-between; min-height: 132px; }
  .stat .num { font-size: 44px; }

  /* ---------- 这个人 ---------- */
  .list { padding: 6px 24px; }
  .list-row { display: flex; align-items: center; gap: 16px; padding: 18px 0; }
  .list-row + .list-row { border-top: 1px solid var(--line); }
  .idx { flex: none; width: 22px; font-size: 13px; font-weight: 300; color: var(--faint); font-variant-numeric: tabular-nums; }
  .list-body { flex: 1; min-width: 0; }
  .list-title { font-size: 16px; }
  .list-sub { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
  .name { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; }
  .name::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .stack { display: grid; gap: 14px; }
</style>
</head>
<body>
<main class="page">

  <header class="topbar">
    <button class="round" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="pill">详情</div>
  </header>

  <!-- 模型 -->
  <div class="section-head">
    <h2 class="section-title">模型</h2>
  </div>
  <section class="card">
    <div class="head-row">
      <span class="label">当前模型</span>
      <span class="chip">sdk-2</span>
    </div>
    <div class="model-name">
      <span class="num">Opus 4.6</span>
      <button aria-label="切换模型">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div class="effort">
      <span class="label">思考强度</span>
      <div class="slider" role="radiogroup" aria-label="思考强度">
        <span class="track"></span><span class="fill"></span>
        <button role="radio"><span class="dot"></span><span>低</span></button>
        <button role="radio"><span class="dot"></span><span>中</span></button>
        <button role="radio"><span class="dot"></span><span>高</span></button>
        <button role="radio"><span class="dot"></span><span>Max</span></button>
      </div>
    </div>

    <div class="divider"></div>
    <div class="row">
      <div>
        <div class="row-title">启用思考链</div>
        <div class="row-sub">仅对支持思考链的模型生效</div>
      </div>
      <button class="switch" role="switch" aria-checked="true" aria-label="启用思考链"></button>
    </div>
  </section>

  <!-- 当前对话窗口 -->
  <div class="section-head">
    <h2 class="section-title">当前对话窗口</h2>
    <button class="round" aria-label="查看对话窗口">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="grid">
    <section class="card remain">
      <div class="remain-main">
        <span class="label">估算余量</span>
        <span class="num">86.3k</span>
        <div class="remain-foot">约 <b>9.7k</b> / 96.0k</div>
      </div>
      <div class="tank" aria-hidden="true"><i style="height:10.1%"></i></div>
    </section>
    <section class="card stat">
      <span class="label">对话</span>
      <div><span class="num">172</span><span class="unit">轮</span></div>
    </section>
    <section class="card stat">
      <span class="label">记录</span>
      <div><span class="num">468</span><span class="unit">条</span></div>
    </section>
  </div>

  <!-- 这个人 -->
  <div class="section-head">
    <h2 class="section-title">这个人</h2>
  </div>
  <div class="stack">
    <section class="card list">
      <div class="list-row">
        <span class="list-body label" style="font-size:15px;letter-spacing:0">备注名</span>
        <span class="name">Claude</span>
      </div>
    </section>

    <section class="card list">
      <a class="list-row">
        <span class="idx">01</span>
        <span class="list-body">
          <div class="list-title">人格</div>
          <div class="list-sub">他是谁、怎么说话、什么偏好</div>
        </span>
        <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="list-row">
        <span class="idx">02</span>
        <span class="list-body">
          <div class="list-title">内心状态</div>
          <div class="list-sub">情绪、欲望、心理空间</div>
        </span>
        <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="list-row">
        <span class="idx">03</span>
        <span class="list-body">
          <div class="list-title">上下文预算</div>
          <div class="list-sub">窗口、记忆、缓存</div>
        </span>
        <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </section>

    <section class="card">
      <div class="row">
        <div>
          <div class="row-title">冲突判定</div>
          <div class="row-sub">关闭后不再触发情绪冲突指南与防御状态</div>
        </div>
        <button class="switch" role="switch" aria-checked="false" aria-label="冲突判定"></button>
      </div>
    </section>
  </div>

</main>
<script>
  document.querySelectorAll('.switch').forEach(function (s) {
    s.addEventListener('click', function () {
      s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true');
    });
  });

  var steps = Array.prototype.slice.call(document.querySelectorAll('.slider button'));
  var fill = document.querySelector('.slider .fill');
  function pick(i) {
    steps.forEach(function (b, j) {
      b.classList.toggle('on', j <= i);
      b.classList.toggle('cur', j === i);
      b.setAttribute('aria-checked', j === i);
    });
    fill.style.width = (i / 3 * 75) + '%';
  }
  steps.forEach(function (b, i) { b.addEventListener('click', function () { pick(i); }); });
  pick(3);
</script>
</body>
</html>
